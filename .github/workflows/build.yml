name: Build PapahNow

on:
  workflow_dispatch:
  push:
    branches: [main]
    inputs:
      ref:
        description: 'Branch/tag to build from FahriAdison/PapahNow'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PapahNow
        uses: actions/checkout@v4
        with:
          repository: FahriAdison/PapahNow
          ref: ${{ inputs.ref || 'phase1-poc' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PapahNow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
