name: Build PapahNow

'on':
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit to build from FahriAdison/PapahNow'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PapahNow
        uses: actions/checkout@v4
        with:
          repository: FahriAdison/PapahNow
          ref: ${{ inputs.ref || 'main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore keystore
        run: |
          echo "${{ secrets.PAPAHNOW_KEYSTORE_BASE64 }}" | base64 -d > /tmp/papahnow.keystore 2>/dev/null
          echo "PAPAHNOW_KEYSTORE_PATH=/tmp/papahnow.keystore" >> $GITHUB_ENV
          echo "PAPAHNOW_KEY_ALIAS=papahnow" >> $GITHUB_ENV

      - name: Patch signing config for CI
        run: |
          python3 - << 'PYEOF'
          import sys
          p = 'app/build.gradle.kts'
          s = open(p).read()
          old = '''    buildTypes {
        release {
            isMinifyEnabled = false
        }
    }'''
          new = '''    signingConfigs {
        create("release") {
            storeFile = file(System.getenv("PAPAHNOW_KEYSTORE_PATH") ?: "papahnow.keystore")
            storePassword = System.getenv("PAPAHNOW_KEYSTORE_PASSWORD") ?: ""
            keyAlias = System.getenv("PAPAHNOW_KEY_ALIAS") ?: "papahnow"
            keyPassword = System.getenv("PAPAHNOW_KEY_PASSWORD") ?: ""
        }
    }
    buildTypes {
        release {
            isMinifyEnabled = false
            signingConfig = signingConfigs.getByName("release")
        }
    }'''
          if old in s:
              s = s.replace(old, new)
              open(p, 'w').write(s)
              print("patched signing config")
          else:
              print("WARNING: signing config pattern not found!")
              sys.exit(1)
          PYEOF

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          PAPAHNOW_KEYSTORE_PASSWORD: ${{ secrets.PAPAHNOW_KEYSTORE_PASSWORD }}
          PAPAHNOW_KEY_PASSWORD: ${{ secrets.PAPAHNOW_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PapahNow-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PapahNow-test-results
          path: app/build/test-results/testDebugUnitTest/
