name: Build PapahNow

'on':
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit to build from FahriAdison/PapahNow'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PapahNow
        uses: actions/checkout@v4
        with:
          repository: FahriAdison/PapahNow
          ref: ${{ inputs.ref || 'main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore keystore
        env:
          PAPAHNOW_KEYSTORE_BASE64: ${{ secrets.PAPAHNOW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${PAPAHNOW_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Required GitHub secret PAPAHNOW_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$PAPAHNOW_KEYSTORE_BASE64" | base64 --decode > /tmp/papahnow.keystore
          if [ ! -s /tmp/papahnow.keystore ]; then
            echo "::error::Keystore decode produced an empty file."
            exit 1
          fi
          echo "PAPAHNOW_KEYSTORE_PATH=/tmp/papahnow.keystore" >> "$GITHUB_ENV"
          echo "PAPAHNOW_KEY_ALIAS=papahnow" >> "$GITHUB_ENV"

      - name: Validate signing credentials
        env:
          PAPAHNOW_KEYSTORE_PASSWORD: ${{ secrets.PAPAHNOW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${PAPAHNOW_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::PAPAHNOW_KEYSTORE_PASSWORD is empty."
            exit 1
          fi
          validate_key() {
            rm -f /tmp/papahnow-validation.csr
            keytool -certreq -alias papahnow \
              -keystore /tmp/papahnow.keystore \
              -storepass "$PAPAHNOW_KEYSTORE_PASSWORD" \
              -keypass "$1" \
              -file /tmp/papahnow-validation.csr \
              -noprompt >/dev/null 2>&1
          }
          if [ -n "${PAPAHNOW_KEY_PASSWORD:-}" ] && validate_key "$PAPAHNOW_KEY_PASSWORD"; then
            effective="$PAPAHNOW_KEY_PASSWORD"
            echo "Validated the dedicated key password."
          elif validate_key "$PAPAHNOW_KEYSTORE_PASSWORD"; then
            effective="$PAPAHNOW_KEYSTORE_PASSWORD"
            echo "Validated that the key password matches the keystore password."
          else
            echo "::error::Neither configured password unlocks alias papahnow. Check the signing secrets."
            exit 1
          fi
          printf 'PAPAHNOW_EFFECTIVE_KEY_PASSWORD=%s\n' "$effective" >> "$GITHUB_ENV"
          rm -f /tmp/papahnow-validation.csr

      - name: Patch signing config for CI
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = "    buildTypes {\n        release {\n            isMinifyEnabled = false\n        }\n    }"
          new = "    signingConfigs {\n        create(\"release\") {\n            storeFile = file(System.getenv(\"PAPAHNOW_KEYSTORE_PATH\") ?: \"papahnow.keystore\")\n            storePassword = System.getenv(\"PAPAHNOW_KEYSTORE_PASSWORD\") ?: \"\"\n            keyAlias = System.getenv(\"PAPAHNOW_KEY_ALIAS\") ?: \"papahnow\"\n            keyPassword = System.getenv(\"PAPAHNOW_EFFECTIVE_KEY_PASSWORD\") ?: \"\"\n        }\n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n            signingConfig = signingConfigs.getByName(\"release\")\n        }\n    }"
          if old not in s:
              raise SystemExit('Expected release buildTypes block was not found')
          p.write_text(s.replace(old, new, 1))
          print('patched signing config')
          PYEOF

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          PAPAHNOW_KEYSTORE_PASSWORD: ${{ secrets.PAPAHNOW_KEYSTORE_PASSWORD }}
          PAPAHNOW_KEY_PASSWORD: ${{ secrets.PAPAHNOW_KEY_PASSWORD }}

      - name: Verify signed release APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" && test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PapahNow-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PapahNow-test-results
          path: app/build/test-results/testDebugUnitTest/
